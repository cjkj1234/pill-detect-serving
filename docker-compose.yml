# docker compose up --build
#   API: http://localhost:8000/docs   웹: http://localhost:8501
# models/model.onnx가 없으면 API는 뜨지만 /health가 model_loaded=false를 알려준다.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/${MODEL_FILE:-model.onnx}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.7}
      MAX_DETECTIONS: ${MAX_DETECTIONS:-4}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
